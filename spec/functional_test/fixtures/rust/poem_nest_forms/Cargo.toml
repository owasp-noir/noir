[package]
name = "poem_nest_forms"
version = "0.1.0"
edition = "2021"

[dependencies]
poem = { version = "3.1", features = ["cookie", "multipart", "static-files"] }
poem-openapi = { version = "5.0", features = ["swagger-ui"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
