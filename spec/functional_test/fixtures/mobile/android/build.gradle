plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.myapp'

    defaultConfig {
        applicationId "com.example.myapp"
        manifestPlaceholders = [
            deepLinkScheme: "myapp",
            deepLinkHost  : "links.example.com"
        ]

        // Groovy property-assignment form on the placeholder map. Termux
        // declares its whole package name this way, and it resolves exactly
        // like a map-literal entry.
        manifestPlaceholders.propScheme = "propapp"
        manifestPlaceholders.propHost = "prop.example.com"
    }

    buildTypes {
        debug {
            // Override that must NOT win over defaultConfig (first wins).
            manifestPlaceholders = [deepLinkHost: "debug.example.com"]
        }
    }
}
