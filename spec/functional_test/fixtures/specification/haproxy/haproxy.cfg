global
    log stdout format raw local0

defaults
    mode http
    timeout client 30s

frontend web
    bind *:80
    acl is_api path_beg /api/
    acl is_static path_beg -i /static/ /assets/
    acl is_health path /healthz
    acl is_v2 path_reg ^/v2/[a-z]+$
    acl is_php path_end .php
    http-request deny if { path_beg /internal }
    http-request deny unless { path_beg /public }
    use_backend api_servers if is_api
    use_backend static_servers if is_static
    default_backend app_servers # fallback

backend api_servers
    http-request deny if { path -m beg /api/admin } !{ src 10.0.0.0/8 }
    server api1 10.0.0.10:8080 check

backend static_servers
    server s1 10.0.0.20:8080

backend app_servers
    server a1 10.0.0.30:8080
