server {
    listen 80;
    server_name widgets.example.org;

    # Refuses every client: not an endpoint.
    location /status {
        stub_status on;
        access_log off;
        deny all;
    }

    # Admits one address first: a restricted endpoint.
    location /metrics {
        allow 127.0.0.1;
        deny all;
        stub_status on;
    }

    location /api/ {
        proxy_pass http://widgets;
    }
}
