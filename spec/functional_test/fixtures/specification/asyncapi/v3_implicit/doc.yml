asyncapi: 3.0.0
info: {title: t, version: 1.0.0}
servers:
  production: {host: stream.example.com, pathname: /v1, protocol: wss}
channels:
  rooms:
    address: '/rooms/{roomId}'
    parameters:
      roomId: {}
    messages:
      chatMessage: {$ref: '#/components/messages/chatMessage'}
    bindings:
      ws:
        query:
          type: object
          properties:
            heartbeat: {type: boolean}
  orders:
    address: 'shop.orders.created'
    messages:
      plain: {$ref: '#/components/messages/plain'}
operations:
  sendRoom:
    action: send
    channel: {$ref: '#/channels/rooms'}
  onOrder:
    action: receive
    channel: {$ref: '#/channels/orders'}
components:
  messages:
    chatMessage:
      payload:
        schemaFormat: application/schema+yaml;version=draft-07
        schema:
          type: object
          properties:
            text: {type: string}
    plain:
      payload:
        type: object
        properties:
          orderId: {type: string}
