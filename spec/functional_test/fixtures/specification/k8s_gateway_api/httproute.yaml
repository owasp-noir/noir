apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - api.example.com
  rules:
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /v1/users
        - method: POST
          path:
            type: Exact
            value: /v1/users
      backendRefs:
        - name: users
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /v2/.*
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/legacy
---
# `kind` is quoted here, which is as valid as the bare form and is what Helm
# charts emit. The header/queryParams matchers are conditions the route will
# not fire without, so they are request params.
apiVersion: gateway.networking.k8s.io/v1
kind: "HTTPRoute"
metadata:
  name: search-route
spec:
  parentRefs:
    - name: example-gateway
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /v1/search
          headers:
            - name: X-Api-Version
              value: "2"
          queryParams:
            - name: q
              value: term
