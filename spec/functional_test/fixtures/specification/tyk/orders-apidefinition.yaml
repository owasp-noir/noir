apiVersion: tyk.tyk.io/v1alpha1
kind: ApiDefinition
metadata:
  name: orders
spec:
  name: Orders
  use_keyless: true
  protocol: http
  active: true
  proxy:
    target_url: http://orders.default.svc:8080
    listen_path: /orders
    strip_listen_path: true
  version_data:
    default_version: Default
    not_versioned: true
    versions:
      Default:
        name: Default
        use_extended_paths: true
        extended_paths:
          white_list:
            - path: /{id}
              method_actions:
                GET:
                  action: no_action
                  code: 200
