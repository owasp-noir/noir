server:
  port: 8080
spring.cloud.gateway.routes:
  - id: users
    uri: http://users:8080
    predicates: [ "Path=/api/users/**", "Method=GET,POST" ]
  - id: host-only
    uri: http://landing:8080
    predicates:
      - Host=**.example.com
  - id: strict
    uri: http://strict:8080
    # The trailing boolean is the `matchTrailingSlash` flag, not a pattern.
    predicates: [ "Path=/strict/{id},false", "Method=PATCH" ]
---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: lb://orders
              predicates:
                - name: Path
                  args:
                    patterns: [ "/api/orders/{id}", "/api/carts/**" ]
                    matchTrailingSlash: false
                - name: Method
                  args:
                    methods: DELETE
