# Spring Cloud Gateway routes in properties form
spring.application.name=gateway
spring.cloud.gateway.routes[0].id=reports
spring.cloud.gateway.routes[0].uri=http://reports:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/reports/**
spring.cloud.gateway.routes[1].id=search
spring.cloud.gateway.routes[1].uri=http://search:8080
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args.patterns=/search
spring.cloud.gateway.routes[1].predicates[1]=Method=PUT
