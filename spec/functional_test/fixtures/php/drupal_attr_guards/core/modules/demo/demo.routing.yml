demo.admin:
  path: '/admin/demo'
  defaults:
    _form: '\Drupal\demo\Form\DemoSettingsForm'
  requirements:
    _permission: 'administer site configuration'

demo.mine:
  path: '/demo/mine'
  defaults:
    _controller: '\Drupal\demo\Controller\DemoController::mine'
  requirements:
    _user_is_logged_in: 'TRUE'

demo.open:
  path: '/demo/open'
  defaults:
    _controller: '\Drupal\demo\Controller\DemoController::open'
  requirements:
    _access: 'TRUE'

demo.register:
  path: '/demo/register'
  defaults:
    _form: '\Drupal\demo\Form\RegisterForm'
  requirements:
    _access_user_register: 'TRUE'

demo.either:
  path: '/demo/either'
  defaults:
    _controller: '\Drupal\demo\Controller\DemoController::either'
  requirements:
    _access: 'TRUE'
    _permission: 'access content'
  options:
    _access_mode: 'ANY'
