# Three static locations, one of each shape the analyzer handles:
#   * classpath: rooted at src/main/resources (always inside the project)
#   * file:      a disk path INSIDE the scan base  -> served
#   * file:      a disk path OUTSIDE the scan base -> must be skipped
# The file: paths are relative to the process working directory, which is
# the repository root when the spec suite runs.
spring.web.resources.static-locations=classpath:/static/,file:spec/functional_test/fixtures/kotlin/spring_static/src/main/resources/extra/,file:spec/functional_test/fixtures/kotlin/spring_static_outside/
