# `<yyyy:year>` uses a converter registered with `register_converter`. Not
# being a builtin, `yyyy` was taken for Marten's name-first order and the
# endpoint declared a param named after the converter.
fixture: fixtures/python/django_custom_converter/
counts: {techs: 1, endpoints: 2}
endpoints:
  - url: "/articles/<yyyy:year>/"
    method: "GET"
    params:
      - {name: "year", type: "path"}
  - url: "/posts/<int:pk>/"
    method: "GET"
    params:
      - {name: "pk", type: "path"}
