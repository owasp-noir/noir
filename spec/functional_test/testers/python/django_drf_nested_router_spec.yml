    method: "GET"
    params:
      - {name: "parent_lookup_project__slug", type: "path"}
      - {name: "slug", type: "path"}
  - url: "/projects/{parent_lookup_project__slug}/versions/{parent_lookup_version__slug}/builds/"
    method: "GET"
    params:
      - {name: "parent_lookup_version__slug", type: "path"}
      - {name: "parent_lookup_project__slug", type: "path"}
