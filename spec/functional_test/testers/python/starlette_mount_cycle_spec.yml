fixture: fixtures/python/starlette_mount_cycle/
counts: {techs: 1, endpoints: 4}
endpoints:
  - url: "/health"
    method: "GET"
  - url: "/internal/status"
    method: "GET"
  - url: "/leaf"
    method: "GET"
  - url: "/loop/branch"
    method: "GET"
