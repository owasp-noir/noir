  - url: "/aliased"
    method: "GET"
    params:
      - {name: "x-token", type: "header"}
  - url: "/direct"
    method: "GET"
    params:
      - {name: "x-token", type: "header"}
  - url: "/literal"
    method: "GET"
    params:
      - {name: "x-token", type: "header"}
  - url: "/open"
    method: "GET"
