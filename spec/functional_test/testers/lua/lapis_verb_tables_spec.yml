    method: "PUT"
  - url: "/fallback/filtered"
    method: "DELETE"
  - url: "/fallback/filtered"
    method: "PATCH"
  - url: "/fallback/inline"
    method: "GET"
  - url: "/fallback/inline"
    method: "POST"
  - url: "/fallback/inline"
    method: "PUT"
  - url: "/fallback/inline"
    method: "DELETE"
  - url: "/fallback/inline"
    method: "PATCH"
  - url: "/fallback/named"
    method: "GET"
  - url: "/fallback/named"
    method: "POST"
