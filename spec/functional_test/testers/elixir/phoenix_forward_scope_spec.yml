# External `forward` is every method at the prefix and below. `get "/"` inside
# a non-root scope is the scope path, not the scope path plus a slash.
fixture: fixtures/elixir/phoenix_forward_scope/
counts: {techs: 1, endpoints: 4}
endpoints:
  - url: "/api/v1/sites"
    method: "GET"
  - url: "/api/v1/sites"
    method: "POST"
  - url: "/api/v1/sites/:id"
    method: "GET"
    params:
      - {name: "id", type: "path"}
  - url: "/sent-emails{/*path}"
    method: "ANY"
