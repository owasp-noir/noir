counts: {techs: 1, endpoints: 22}
endpoints:
  - url: "/get_param.jsp"
    method: "GET"
    params:
      - {name: "username", type: "query"}
      - {name: "password", type: "query"}
  - url: "/el.jsp"
    method: "GET"
    params:
      - {name: "username", type: "query"}
  # A JSP under `src/main/webapp/` is served relative to that root — the
  # build prefix is stripped (`/reports/summary.jsp`, not the repo path).
  - url: "/reports/summary.jsp"
    method: "GET"
    params:
      - {name: "range", type: "query"}
  - url: "/attribute.jsp"
    method: "GET"
    params:
      - {name: "userId", type: "query"}
  - url: "/header.jsp"
    method: "GET"
    params:
      - {name: "X-API-Key", type: "header"}
  # `cookie.jsp` only calls `request.getCookies()`, which names no cookie.
  # The endpoint is still real, it just carries no param — an empty-named
  # one used to stand in for "reads cookies" and corrupted every builder
  # downstream (`--cookie '='`, `{"name": "", "in": "cookie"}`).
  - url: "/cookie.jsp"
    method: "GET"
  - url: "/advanced.jsp"
    method: "GET"
    params:
      - {name: "q", type: "query"}
      - {name: "tag", type: "query"}
      - {name: "mode", type: "query"}
      - {name: "sort", type: "query"}
      - {name: "category", type: "query"}
      - {name: "X-Trace", type: "header"}
      - {name: "session_id", type: "cookie"}
  # A page that reads a JSON body from `request.getInputStream()` or
  # `request.getReader()` gets a POST endpoint with the first-level keys it
  # reads. `data.getString("paymentId")` in json_reader.jsp reads a nested
  # object and is not reported as a body key.
  - url: "/webhook.jsp"
    method: "GET"
  - url: "/webhook.jsp"
    method: "POST"
    params:
      - {name: "secret", type: "json"}
      - {name: "orderId", type: "json"}
  - url: "/json_reader.jsp"
    method: "GET"
    params:
      - {name: "X-Signature", type: "header"}
  - url: "/json_reader.jsp"
    method: "POST"
    params:
      - {name: "X-Signature", type: "header"}
      - {name: "eventType", type: "json"}
      - {name: "retry", type: "json"}
      - {name: "data", type: "json"}
  - url: "/login"
    method: "POST"
