# An unnamed catch-all (`routes/[...].ts`) is a wildcard like `[...slug]`,
# not a literal segment. A bare file answers every verb.
fixture: fixtures/javascript/nitro_catchall/
counts: {techs: 1, endpoints: 7}
endpoints:
  - url: "/*"
    method: "GET"
  - url: "/*"
    method: "POST"
  - url: "/*"
    method: "PUT"
  - url: "/*"
    method: "DELETE"
  - url: "/*"
    method: "PATCH"
  - url: "/*"
    method: "HEAD"
  - url: "/*"
    method: "OPTIONS"
