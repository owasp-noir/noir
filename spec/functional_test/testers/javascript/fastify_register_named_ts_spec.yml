# Plugins registered by imported name, the way a large TypeScript Fastify
# backend nests them:
#
#   server.register(async (v1) => { v1.register(registerV1Routes) }, { prefix: "/api/v1" })
#   server.register(registerAdminRouter, { prefix: "/admin" })   // export const registerAdminRouter = async (server) => { server.route({...}) }
#   await registerAccessRouter(pkiRouter)                        // a plugin called on the instance
#   import { registerEeRoutes } from "@app/ee/routes"            // tsconfig `paths` alias
#
# `server.route({ method, url })` routes in such plugins lost every prefix;
# two plugins exported by one file keep their own.
fixture: fixtures/javascript/fastify_register_named_ts/
counts: {techs: 1, endpoints: 10}
endpoints:
  - url: "/api/status"
    method: "GET"
  - url: "/api/v1/license/plan"
    method: "GET"
  - url: "/api/v1/admin/config"
    method: "GET"
  - url: "/api/v2/legacy/admin/config"
    method: "GET"
  - url: "/api/v1/read/items"
    method: "GET"
  - url: "/api/v2/legacy/read/items"
    method: "GET"
  - url: "/api/v1/write/items"
    method: "POST"
  - url: "/api/v2/legacy/write/items"
    method: "POST"
  - url: "/api/v1/pki/access/users/:userId"
    method: "DELETE"
    params:
      - {name: "userId", type: "path"}
  - url: "/api/v2/legacy/pki/access/users/:userId"
    method: "DELETE"
    params:
      - {name: "userId", type: "path"}
