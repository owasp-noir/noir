# Folio pages under each `Folio::path(...)` mount become GET routes:
# `index` is the directory, `[User]` / `[...slug]` are path params. Views
# outside a mount (and under a commented-out mount) are not endpoints.
fixture: fixtures/php/folio/
counts: {techs: 3, endpoints: 7}
endpoints:
  - url: "/"
    method: "GET"
  - url: "/users"
    method: "GET"
  - url: "/users/{user}"
    method: "GET"
    params:
      - {name: "user", type: "path"}
  - url: "/admin"
    method: "GET"
  - url: "/admin/settings"
    method: "GET"
  - url: "/docs/{slug}"
    method: "GET"
    params:
      - {name: "slug", type: "path"}
  # `Folio::domain(...)->path(...)` is a mount too.
  - url: "/tenant/dashboard"
    method: "GET"
