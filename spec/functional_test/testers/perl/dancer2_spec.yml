fixture: fixtures/perl/dancer2/
counts: {techs: 1, endpoints: 36}
endpoints:
  # Basic verbs (lib/MyApp.pm)
  - url: "/"
    method: "GET"
    params:
      - {name: "page", type: "query"}
  - url: "/search"
    method: "GET"
    params:
      - {name: "q", type: "query"}
      - {name: "limit", type: "query"}
  - url: "/users"
    method: "POST"
    params:
      - {name: "name", type: "form"}
      - {name: "email", type: "form"}
  - url: "/users/:id"
    method: "PUT"
    params:
      - {name: "id", type: "path"}
      - {name: "name", type: "form"}
  - url: "/users/:id"
    method: "PATCH"
    params:
      - {name: "id", type: "path"}
  - url: "/users/:id"
    method: "DELETE"
    params:
      - {name: "id", type: "path"}
  - url: "/health"
    method: "OPTIONS"
  - url: "/profile"
    method: "GET"
    params:
      - {name: "Authorization", type: "header"}
      - {name: "session_id", type: "cookie"}
  - url: "/upload"
    method: "POST"
    params:
      - {name: "document", type: "form"}
  - url: "/login"
    method: "POST"
    params:
      - {name: "username", type: "form"}
      - {name: "password", type: "form"}
  # any with explicit method list
  - url: "/feedback"
    method: "GET"
  - url: "/feedback"
    method: "POST"
  # any bare → every supported verb
  - url: "/wildcard"
    method: "GET"
  - url: "/wildcard"
    method: "POST"
  - url: "/wildcard"
    method: "PUT"
  - url: "/wildcard"
    method: "DELETE"
  - url: "/wildcard"
    method: "PATCH"
  - url: "/wildcard"
    method: "OPTIONS"
  - url: "/wildcard"
    method: "HEAD"
  # any with single-element method lists (`delete`/`head` spellings) → that
  # verb only, not an expand-to-everything fallback
  - url: "/cache"
    method: "DELETE"
  - url: "/heartbeat"
    method: "HEAD"
  # bare any + legacy `param` → query for read verbs, form for write verbs
  - url: "/notify"
    method: "GET"
    params:
      - {name: "message", type: "query"}
  - url: "/notify"
    method: "POST"
    params:
      - {name: "message", type: "form"}
  - url: "/notify"
    method: "PUT"
    params:
      - {name: "message", type: "form"}
  - url: "/notify"
    method: "DELETE"
    params:
      - {name: "message", type: "form"}
  - url: "/notify"
    method: "PATCH"
    params:
      - {name: "message", type: "form"}
  - url: "/notify"
    method: "OPTIONS"
    params:
      - {name: "message", type: "query"}
  - url: "/notify"
    method: "HEAD"
    params:
      - {name: "message", type: "query"}
  # wildcard + regex routes
  - url: "/files/*"
    method: "GET"
  # `get qr{/ticket/(?<code>[0-9]+)}` — the optimizer rewrites the named
  # capture group to the canonical `{code}` placeholder, so the URL agrees
  # with the path param the analyzer records.
  - url: "/ticket/{code}"
    method: "GET"
    params:
      - {name: "code", type: "path"}
  # block-scoped prefix (nested)
  - url: "/api/status"
    method: "GET"
  - url: "/api/tokens"
    method: "POST"
    params:
      - {name: "scope", type: "form"}
  - url: "/api/v2/ping"
    method: "GET"
  # procedural prefix
  - url: "/admin/dashboard"
    method: "GET"
  - url: "/admin/settings"
    method: "POST"
    params:
      - {name: "key", type: "form"}
  # back to root after `prefix undef`
  - url: "/ping"
    method: "GET"
