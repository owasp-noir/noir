# Router builders called from another package (`routes.RegisterUsers(api)`)
# take the caller's group prefix, and an inline sub-group argument
# (`addHealth(api.Group("/health"))`) keeps its receiver's prefix too.
fixture: fixtures/go/gin_router_builder_crosspkg/
counts: {techs: 1, endpoints: 4}
endpoints:
  - url: "/api/v1/users/:id"
    method: "GET"
    params:
      - {name: "id", type: "path"}
  - url: "/api/v1/users"
    method: "POST"
  - url: "/api/v1/posts/:slug"
    method: "GET"
    params:
      - {name: "slug", type: "path"}
  - url: "/api/v1/health/live"
    method: "GET"
