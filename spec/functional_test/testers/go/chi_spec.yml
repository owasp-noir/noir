      - {name: "articleSlug", type: "path"}
  - url: "/articles/{articleID}/"
    method: "GET"
    params:
      - {name: "articleID", type: "path"}
  - url: "/articles/{articleID}/"
    method: "PUT"
    params:
      - {name: "articleID", type: "path"}
  - url: "/articles/{articleID}/"
    method: "DELETE"
    params:
      - {name: "articleID", type: "path"}
