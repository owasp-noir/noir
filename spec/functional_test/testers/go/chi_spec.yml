fixture: fixtures/go/chi/
counts: {techs: 1, endpoints: 42}
endpoints:
  - url: "/"
    method: "GET"
  # GET /articles/ and GET /articles/{month}-{day}-{year} come from
  # `r.With(paginate).Get(...)` — the tree-sitter extractor walks the
  # middleware chain so these no longer go missing.
  - url: "/articles/"
    method: "GET"
  - url: "/articles/{month}-{day}-{year}"
    method: "GET"
    params:
      - {name: "day", type: "path"}
      - {name: "month", type: "path"}
      - {name: "year", type: "path"}
  - url: "/articles/"
