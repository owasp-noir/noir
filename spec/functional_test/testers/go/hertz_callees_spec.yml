# Regression test for --include-callee on Hertz (#1366). Mirrors
# Gin/Echo/Fiber. Hertz's handler signature takes `(c context.Context,
# ctx *app.RequestContext)`, so callees on the request context come
# back as `ctx.PostForm` / `ctx.JSON` rather than `c.JSON`.
#
# Note: this fixture does NOT exercise the `.Any("/path", ...)` verb
# expansion path on purpose — that's covered by the existing
# `hertz_spec.cr` route-extraction tests. Here we only need to confirm
# that the per-emit-endpoint callee push runs in both the ANY and the
# single-verb branches of `hertz.cr`. Adding an Any route would just
# re-state the same assertion N times.
#
# Also note `string(name)` in handlers.go is filtered by `BUILTINS` —
# Go primitive type-conversions don't surface as callees.
fixture: fixtures/go/hertz_callees/
counts: {techs: 1, endpoints: 4}
options:
  include_callee: true
endpoints:
  - url: "/users"
    method: "POST"
    params:
      - {name: "name", type: "form"}
    callees:
      - {name: "ctx.PostForm", line: 10}
      - {name: "saveUser", path: "./spec/functional_test/fixtures/go/hertz_callees/helpers.go", line: 3}
      - {name: "auditLog", path: "./spec/functional_test/fixtures/go/hertz_callees/helpers.go", line: 7}
      - {name: "ctx.JSON", line: 13}
  - url: "/healthz"
    method: "GET"
    callees:
      - {name: "ctx.JSON", line: 14}
  - url: "/profile"
    method: "GET"
    callees:
      - {name: "buildProfile", path: "./spec/functional_test/fixtures/go/hertz_callees/helpers.go", line: 10}
      - {name: "auditLog", path: "./spec/functional_test/fixtures/go/hertz_callees/helpers.go", line: 7}
      - {name: "ctx.JSON", line: 19}
  - url: "/wrapped-feed"
    method: "GET"
    callees:
      - {name: "loadFeed", path: "./spec/functional_test/fixtures/go/hertz_callees/remote/feed.go", line: 14}
      - {name: "ctx.JSON", path: "./spec/functional_test/fixtures/go/hertz_callees/remote/feed.go", line: 11}
