# `{var=pattern}` path templates are transcoding syntax. The URL is spelled the
# way a client can request it: literals stay, the last wildcard takes the
# variable's name, earlier wildcards become `{wildcard}`, `{wildcard2}`, ...
# The variable is still the one declared path param. A trailing `**` matches
# one or more segments, so its variable is the rest placeholder `{*name}`.
fixture: fixtures/specification/grpc_path_template/
counts: {techs: 1, endpoints: 8}
endpoints:
  - url: "/api/attachments/{name}"
    method: "GET"
    params:
      - {name: "name", type: "path"}
  - url: "/api/memos/{parent}/comments"
    method: "GET"
    params:
      - {name: "parent", type: "path"}
  - url: "/v1/projects/{wildcard}/serviceAccounts/{wildcard2}/keys/{name}:inspect"
    method: "GET"
    params:
      - {name: "wildcard", type: "path"}
      - {name: "wildcard2", type: "path"}
      - {name: "name", type: "path"}
  - url: "/v1/publishers/{wildcard}/books/{book.name}"
    method: "PATCH"
    params:
      - {name: "wildcard", type: "path"}
      - {name: "book.name", type: "path"}
      - {name: "book", type: "json"}
  - url: "/v1/{*resource}:testIamPermissions"
    method: "POST"
    params:
      - {name: "resource", type: "path"}
  - url: "/v1/repeat/a/{first}/b/{*second}"
    method: "GET"
    params:
      - {name: "first", type: "path"}
      - {name: "second", type: "path"}
  # No wildcard: the client requests the literal.
  - url: "/v1/operations"
    method: "GET"
    params:
      - {name: "name", type: "path"}
  # A bare `{var}` is already a plain placeholder.
  - url: "/v1/plain/{name}"
    method: "GET"
    params:
      - {name: "name", type: "path"}
