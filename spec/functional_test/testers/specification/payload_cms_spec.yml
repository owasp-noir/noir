      - {name: "password", type: "json", value: "string"}
  - url: "/api/users/unlock"
    method: "POST"
    params:
      - {name: "email", type: "json"}
  # Globals are read with GET and written with POST.
  - url: "/api/globals/site-settings"
    method: "GET"
    params:
      - {name: "locale", type: "query"}
      - {name: "depth", type: "query"}
      - {name: "populate", type: "query"}
      - {name: "select", type: "query"}
  - url: "/api/globals/site-settings"
    method: "POST"
    params:
      - {name: "siteName", type: "json", value: "string"}
      - {name: "maintenance", type: "json", value: "boolean"}
