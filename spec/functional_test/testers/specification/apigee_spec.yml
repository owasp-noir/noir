fixture: fixtures/specification/apigee/
counts: {techs: 1, endpoints: 9}
endpoints:
  - url: "/v1/hr/users/*"
    method: "GET"
  - url: "/v1/hr/users"
    method: "POST"
  # JavaRegex anchors are stripped; no verb condition means any verb.
  - url: "/v1/hr/reports/[0-9]+"
    method: "ANY"
  - url: "/v1/hr/exports/**"
    method: "ANY"
  - url: "/v1/hr/items/*"
    method: "GET"
  # Each `or` branch keeps its own verb: no `POST /a` or `GET /b`.
  - url: "/v1/hr/a"
    method: "GET"
  - url: "/v1/hr/b"
    method: "POST"
  # A negated path clause is not a route; only the verb applies.
  - url: "/v1/hr"
    method: "PATCH"
  # A proxy endpoint without conditional flows exposes its whole base path.
  - url: "/health"
    method: "ANY"
