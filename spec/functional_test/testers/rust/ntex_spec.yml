fixture: fixtures/rust/ntex/
counts: {techs: 1, endpoints: 15}
endpoints:
  - url: "/users/{id}"
    method: "GET"
    params:
      - {name: "id", type: "path"}
  - url: "/echo"
    method: "POST"
  - url: "/hey"
    method: "GET"
  # Bare `Query<T>` / `Form<T>` imported from `ntex::web::types`.
  - url: "/search"
    method: "GET"
    params:
      - {name: "q", type: "query"}
  - url: "/files/{all}"
    method: "GET"
    params:
      - {name: "all", type: "path"}
  # Handlers mounted through a tuple `.service((...))` under a scope.
  - url: "/api/v1/items/{id}"
    method: "PUT"
    params:
      - {name: "id", type: "path"}
      - {name: "name", type: "json"}
  - url: "/api/v1/login"
    method: "POST"
    params:
      - {name: "username", type: "form"}
