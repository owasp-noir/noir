    method: "GET"
  - url: "/api/v1/stats"
    method: "GET"
    params:
      - {name: "q", type: "query"}
  # Nested tuple scopes in a `.configure`d fn (src/appconfig.rs).
  - url: "/products"
    method: "GET"
    params:
      - {name: "name", type: "query"}
  - url: "/products"
    method: "POST"
    params:
      - {name: "name", type: "json"}
  - url: "/products/{product_id}"
    method: "GET"
    params:
      - {name: "product_id", type: "path"}
  - url: "/products/{product_id}"
    method: "DELETE"
    params:
      - {name: "product_id", type: "path"}
  - url: "/products/{product_id}/parts/{part_id}"
    method: "GET"
    params:
      - {name: "product_id", type: "path"}
      - {name: "part_id", type: "path"}
