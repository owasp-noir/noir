# `axum::routing::any(...)` and service mounts (`route_service`,
# `nest_service`, `fallback_service`) register a route under every
# HTTP method. noir now fans them out so SARIF / Postman / OpenAPI
# consumers see real HTTP methods instead of a non-HTTP "ANY"
# string. The four routes below (/ws, /favicon.ico, /assets/*, /*)
# each surface as one endpoint per canonical method.
fixture: fixtures/rust/axum/
counts: {techs: 1, endpoints: 49}
endpoints:
  - url: "/"
    method: "GET"
  - url: "/foo"
    method: "GET"
  - url: "/bar"
    method: "POST"
  - url: "/search"
    method: "GET"
    params:
      - {name: "query", type: "query"}
  - url: "/search_query"
    method: "QUERY"
    params:
      - {name: "query", type: "query"}
  - url: "/items"
    method: "GET"
  - url: "/items"
    method: "QUERY"
    params:
      - {name: "query", type: "query"}
  - url: "/svc"
    method: "QUERY"
  - url: "/filter-query"
    method: "QUERY"
  - url: "/filter-combo"
    method: "GET"
  - url: "/filter-combo"
    method: "QUERY"
  - url: "/submit"
    method: "POST"
    params:
      - {name: "form", type: "form"}
  - url: "/headers"
    method: "GET"
    params:
      - {name: "X-Request-Id", type: "header"}
  - url: "/session"
    method: "GET"
    params:
      - {name: "session_id", type: "cookie"}
  - url: "/api/users"
    method: "GET"
  - url: "/api/admin"
    method: "POST"
  - url: "/api/query-nested"
    method: "QUERY"
  - url: "/internal/health"
    method: "GET"
  - url: "/v1/projects"
    method: "GET"
  - url: "/v1/projects/{id}"
    method: "GET"
    params:
      - {name: "id", type: "path"}
  - url: "/root/api/audit"
    method: "GET"
  - url: "/ws"
    method: "GET"
  - url: "/ws"
    method: "POST"
  - url: "/ws"
    method: "PUT"
  - url: "/ws"
    method: "PATCH"
  - url: "/ws"
    method: "DELETE"
  - url: "/ws"
    method: "HEAD"
  - url: "/ws"
    method: "OPTIONS"
  - url: "/favicon.ico"
    method: "GET"
  - url: "/favicon.ico"
    method: "POST"
  - url: "/favicon.ico"
    method: "PUT"
  - url: "/favicon.ico"
    method: "PATCH"
  - url: "/favicon.ico"
    method: "DELETE"
  - url: "/favicon.ico"
    method: "HEAD"
  - url: "/favicon.ico"
    method: "OPTIONS"
  - url: "/assets/*"
    method: "GET"
  - url: "/assets/*"
    method: "POST"
  - url: "/assets/*"
    method: "PUT"
  - url: "/assets/*"
    method: "PATCH"
  - url: "/assets/*"
    method: "DELETE"
  - url: "/assets/*"
    method: "HEAD"
  - url: "/assets/*"
    method: "OPTIONS"
  - url: "/*"
    method: "GET"
  - url: "/*"
    method: "POST"
  - url: "/*"
    method: "PUT"
  - url: "/*"
    method: "PATCH"
