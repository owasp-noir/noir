# Endpoints that register a device or store its push token (FCM, APNs).
key: device
name: Device Tagger
summary: Identifies device and push token registration endpoints
order: 630
tag:
  tagger: Device
  description: Device or push token registration endpoint; review for binding a device or token to another user's account (intercepting their notifications), IDOR on the list of registered devices, and tokens that stay registered after logout.
match:
  any:
    - all:
        - path_segment: [device, devices, fcm, apns]
        # The OAuth device flow (`/oauth/device/code`,
        # `/device_authorization`) signs a user in on a device; it belongs
        # to the oauth tagger.
        - not:
            path_segment: [oauth, oauth2]
        - not:
            url_contains: [device/code, device_authorization, device-authorization,
                           deviceauthorization]
        # A static asset (`/js/device.js`) is not a handler.
        - not:
            path_extension: [css, js, mjs, map, png, jpg, jpeg, gif, svg, ico, webp,
                             woff, woff2, ttf, otf, eot]
    # `push` alone is also `git push`. It counts next to the token it
    # registers.
    - all:
        - path_segment: push
        - path_segment: [token, tokens, register, registration]
    # A push token names a device registration on any route. A bare `token`
    # is too common to list.
    - param:
        name: [device_token, fcm_token, push_token, apns_token, registration_token]
examples:
  match:
    - { url: /devices }
    - { method: POST, url: /push/token }
    - { method: POST, url: /v1/fcm/token }
    - { method: POST, url: /devices/register, params: [{ name: device_token, type: json }] }
    - { method: POST, url: /api/users/me, params: [{ name: fcmToken, type: json }] }
  no_match:
    - { method: POST, url: /oauth/device/code }
    - { method: POST, url: /device_authorization }
    - { method: POST, url: /repos/push }
    - { method: POST, url: /api/login, params: [{ name: token, type: json }] }
    - { url: /static/js/device.js }
