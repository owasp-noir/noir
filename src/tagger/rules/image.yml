# Endpoints that resize or crop an image or build a thumbnail. One that
# downloads the image from a caller-supplied address is also a proxy; the
# proxy tagger marks that side and the overlap is fine.
key: image
name: Image Tagger
summary: Identifies image resize, crop and thumbnail endpoints
order: 570
tag:
  tagger: Image
  description: Image resize or thumbnail endpoint; review for denial of service through very large dimensions or many size variants, SSRF when the source image is fetched from a URL, path traversal in the file name, and bugs in the image library on crafted files.
match:
  any:
    # `thumbnail` also covers `/getThumbnail` and `/thumbnails`. The result
    # of a resize is an image, so image extensions stay in; a script or
    # style sheet is a static asset.
    - all:
        - any:
            - url_contains: thumbnail
            - path_segment: thumb
        - not:
            path_extension: [css, js, mjs, map, woff, woff2, ttf, otf, eot]
    # `resize` is also a server or volume action (`/servers/{id}/resize`)
    # and `crop` a field in farming data, so they count only next to an
    # image word or with dimensions.
    - all:
        - path_segment: [resize, crop]
        - any:
            - path_segment: [image, images, img, photo, photos, picture, pictures,
                             avatar, avatars, media]
            - param: { name: [width, height, w, h] }
    # camelCase actions lowercase into one segment (`/api/resizeImage`).
    - url_contains: [resizeimage, imageresize, cropimage, imagecrop]
examples:
  match:
    - { url: /thumbnail }
    - { url: "/api/files/{id}/thumbnail.jpg" }
    - { url: "/thumb/{size}/{name}" }
    - { url: /images/resize, params: [{ name: url }] }
    - { url: /resize, params: [{ name: w }, { name: h }] }
    - { method: POST, url: /api/resizeImage }
  no_match:
    - { method: POST, url: "/servers/{id}/resize" }
    - { url: /api/crop/yields }
    - { url: "/posts/{id}/thumbs-up" }
    - { url: /static/js/thumbnail.js }
    - { url: /api/images }
