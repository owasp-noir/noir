python_cherrypy:
  framework: "CherryPy"
  language: "Python"
  similar: ["cherrypy", "cherry-py", "python-cherrypy", "python_cherrypy"]
  supported:
    endpoint: true
    # CherryPy's default dispatcher is object-traversal, not explicit
    # route registration, so the HTTP method for a plain `@expose`d
    # method is inferred (GET, matching every other analyzer's
    # no-explicit-method convention) rather than declared in source.
    # `MethodDispatcher`-style classes (uppercase GET/POST/PUT/DELETE
    # methods) give a real, explicit method signal.
    method: true
    params: {query: true, path: true, body: true, header: true, cookie: true}
    static_path: false
    websocket: false
  context: {callee: true}

python_cli:
  framework: "CLI (argparse / click / typer / fire / docopt / getopt / absl / cleo)"
  language: "Python"
  similar: ["python-cli", "python_cli", "argparse", "click", "typer", "fire", "docopt", "absl", "abseil", "cleo"]
  supported:
    endpoint: true
    # CLI endpoints carry the synthetic "CLI" verb, not an HTTP method,
    # and their inputs are flag/argument/env params, outside the HTTP
    # query/path/body/header/cookie buckets the docs table tracks.
    method: false
    params: {query: false, path: false, body: false, header: false, cookie: false}
    static_path: false
    websocket: false

