# The client half of the GraphQL surface: `query Foo { … }` /
# `mutation Bar { … }` documents shipped as `.graphql` / `.gql` files,
# as opposed to the `type Query { … }` SDL schema `graphql_sdl` reads.
#
# It had no catalog entry until now because the analyzer behind it was
# a `FileAnalyzer` hook rather than a registered tech analyzer: its
# endpoints came out with `"technology": null`, and because the hook ran
# outside the tech registry, `--only-techs <anything>` returned them as
# well. Naming the technology is what lets a report group them and
# `--only-techs graphql_operation` / `--exclude-techs graphql_operation`
# address them.
#
# `"graphql"` and `".graphql"` are deliberately NOT claimed here — they
# are `graphql_sdl`'s aliases and moving them would silently repoint
# every existing `-t graphql` at a different analyzer.
graphql_operation:
  view: "traffic"
  format: ["GRAPHQL"]
  similar: ["graphql_operation", "graphql-operation", "graphql_operations", "graphql-operations", "graphql_document", "graphql-document"]
  supported:
    endpoint: true
    method: true
    params: {query: false, path: false, body: true, header: false, cookie: false}

# `:graphql` used to sit here with no analyzer and no detector behind it
# — a catalog entry that advertised support nothing could deliver, and
# whose `"graphql"` / `".graphql"` aliases resolved to that dead end
# instead of to the analyzer that really reads those files. The aliases
# moved onto `graphql_sdl`, whose detector already claims `.graphql`
# (see `Detector::Specification::GraphqlSdl#applicable?`), so `-t
# graphql` now selects a tech that produces endpoints.
graphql_sdl:
  view: "spec"
  format: ["GRAPHQL_SDL"]
  similar: ["graphql_sdl", "graphql-sdl", "graphql_schema", ".graphqls", "graphql", ".graphql"]
  supported:
    endpoint: true
    method: true
    params: {query: false, path: false, body: true, header: false, cookie: false}

grpc:
  view: "spec"
  format: ["PROTOBUF"]
  similar: ["grpc", "protobuf", "proto", "grpc-gateway"]
  supported:
    endpoint: true
    method: true
    params: {query: true, path: true, body: true, header: false, cookie: false}
  # Guards: the Go interceptor's procedure allow-list (`go_auth`).
  context: {guards: true}

