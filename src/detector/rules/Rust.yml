      - regex: '(?ms)^\s*poem(-openapi)?\s*=\s*'
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          poem = { version = "3.1" }
      - path: Cargo.toml
        content: |-
          [dependencies]
          poem-openapi = { version = "5.0" }
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          axum = {}
      - {path: main.rs, content: "use poem::prelude::*;"}

