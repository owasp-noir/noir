ActixWeb:
  key: rust_actix_web
  gate: {extensions: [.rs], basenames: [Cargo.toml, Cargo.lock]}
  files: {path_segments: [Cargo.toml]}
  match:
    all:
      - contains: dependencies
      - cargo_dependency: actix-web
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          actix-web = "4"
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          serde = "1"

Axum:
  key: rust_axum
  gate: {extensions: [.rs], basenames: [Cargo.toml, Cargo.lock]}
  files: {path_segments: [Cargo.toml]}
  match:
    all:
      - contains: dependencies
      - cargo_dependency: axum
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          axum = {}
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          serde = "1"

Cli:
  key: rust_cli
  gate: {extensions: [.rs], basenames: [Cargo.toml]}
  match:
    any:
      - all:
          - files: {basenames: [Cargo.toml]}
          - contains: 'dependencies'
          - regex: '(?m)^\s*(?:clap|structopt|argh|bpaf|pico\-args|getopts)\b'
      - all:
          - files: {extensions: [.rs]}
          - any:
              - regex:
                  - '#\[\s*derive\s*\([^)]*\b(?:Parser|Subcommand|Args)\b'
                  - '#\[\s*derive\s*\([^)]*\bStructOpt\b'
                  - '#\[\s*derive\s*\([^)]*\bFromArgs\b'
                  - '\buse\s+(?:clap|structopt|argh|bpaf|pico_args|getopts)\b|\b(?:clap|structopt|argh|bpaf|pico_args|getopts)::'
                  - '\b(?:std::)?env::args(?:_os)?\s*\('
              - all:
                  - contains: 'clap'
                  - regex: '\bCommand::new\s*\('
  examples:
    match:
      - {path: 'app.rs', content: "use clap::Parser;"}
    no_match:
      - {path: 'app.rs', content: "let cmd = Command::new(\"sh\");"}

Dioxus:
  key: rust_dioxus
  files: {basenames: [Cargo.toml]}
  match:
    regex: '(?ms)^\s*(?:dioxus\s*[=.]|\[(?:[\w.-]+\.)?dependencies\.dioxus\])'
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          dioxus = { version = "0.8", features = ["fullstack"] }
      - path: Cargo.toml
        content: |-
          [dependencies]
          dioxus.workspace = true
      - path: Cargo.toml
        content: |-
          [dependencies.dioxus]
          version = "0.8"
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          dioxus_router = "0.8"
          dioxus-cli = "0.8"
      - {path: main.rs, content: "use dioxus::prelude::*;"}

Gotham:
  key: rust_gotham
  gate: {extensions: [.rs], basenames: [Cargo.toml, Cargo.lock]}
  files: {path_segments: [Cargo.toml]}
  match:
    all:
      - contains: dependencies
      - cargo_dependency: gotham
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          gotham = "0.7"
      - path: Cargo.toml
        content: |-
          [package]
          name = "my-app"
          version = "0.1.0"

          [dependencies]
          gotham = "0.7"
          serde = "1.0"
          tokio = "1.0"
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          rocket = "0.5"
      - {path: main.rs, content: "use gotham::prelude::*;"}

