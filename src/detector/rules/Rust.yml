Ntex:
  key: rust_ntex
  files: {basenames: [Cargo.toml]}
  match:
    all:
      - contains: dependencies
      - regex: '(?ms)^\s*(?:ntex\s*[=.]|\[(?:[\w.-]+\.)?dependencies\.ntex\])'
  examples:
    match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          ntex = { version = "2", features = ["tokio"] }
      - path: Cargo.toml
        content: |-
          [dependencies]
          ntex.workspace = true
      - path: Cargo.toml
        content: |-
          [dependencies.ntex]
          version = "2"
    no_match:
      - path: Cargo.toml
        content: |-
          [dependencies]
          ntex-mqtt = "4"
          ntex-bytes = "0.1"
      - path: Cargo.toml
        content: |-
          [dependencies]
          actix-web = "4"
      - {path: src/main.rs, content: "use ntex::web;"}
      - path: Cargo.lock
        content: |-
          [[package]]
          name = "ntex"
          dependencies = []

