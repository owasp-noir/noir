Django:
  key: python_django
  files: {extensions: [.py]}
  match:
    all:
      - contains: [django, rest_framework]
      - any:
          - regex: '(^|\n)\s*from\s+django\.'
          - regex: '(^|\n)\s*import\s+django(\s|,|$)'
          - regex: '(^|\n)\s*from\s+rest_framework[\s.]'
          - regex: '(^|\n)\s*import\s+rest_framework(\s|,|\.|$)'
  examples:
    match:
      - {path: settings.py, content: "from django.apps import AppConfig"}
      - {path: manage.py, content: "import django"}
      - {path: urls.py, content: "from rest_framework.routers import DefaultRouter"}
      - {path: views.py, content: "from rest_framework import viewsets"}
      - {path: views.py, content: "import rest_framework"}
    no_match:
      - {path: views.py, content: "from rest_framework_ext import helpers"}
      - {path: app.py, content: "from flask import Flask"}

