HttpServer:
  key: python_http_server
  files: {extensions: [.py]}
  match:
    any:
      - regex: '(?:^|\n)[ \t\x{FEFF}]*(?:from[ \t]+http\.server[ \t]+import\b|import[ \t]+(?:[\w.]+[ \t]*,[ \t]*)*http\.server\b|from[ \t]+http[ \t]+import[ \t]+(?:[\w,][\w, \t]*[ \t,])?server\b)'
      - regex: '\bclass\s+\w+\s*\(\s*(?:[\w.]+\s*,\s*)*(?:[\w.]+\.)?(?:Base|Simple|CGI)HTTPRequestHandler\s*[,)]'
  examples:
    match:
      - {path: server.py, content: "from http.server import BaseHTTPRequestHandler, HTTPServer"}
      - path: h.py
        content: |-
          import http.server
          server = http.server.HTTPServer(('', 8080), Handler)
      - path: handler.py
        content: |-
          class MyHandler(BaseHTTPRequestHandler):
              def do_GET(self): pass
      - {path: static.py, content: "from http.server import SimpleHTTPRequestHandler"}
      - path: s.py
        content: |
          import socketserver, http.server
      - {path: s.py, content: "\uFEFFimport http.server\n"}
      - path: handler.py
        content: |-
          class Handler(ThreadingMixIn, BaseHTTPRequestHandler):
              pass
      - path: s.py
        content: |-
          from http import server
          server.HTTPServer(('', 0), H)
    no_match:
      - {path: requirements.txt, content: "http.server"}
      - {path: other.py, content: "print('hello')"}
      - path: util.py
        content: |-
          """Utilities.

          To preview the generated docs locally run:

              python -m http.server 8000
          """

          def add(a, b):
              return a + b
      - path: main.py
        content: |-
          import tornado.web
          from tornado.httpserver import HTTPServer

          server = HTTPServer(tornado.web.Application([]))

