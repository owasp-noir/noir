Aiohttp:
  key: python_aiohttp
  files: {extensions: [.py]}
  match:
    all:
      - contains: aiohttp
      - any:
          - regex: '(^|\n)\s*from\s+aiohttp(\.|[\s])'
          - regex: '(^|\n)\s*import\s+aiohttp(\s|,|$|\.)'
  examples:
    match:
      - {path: app.py, content: "from aiohttp import web"}
      - {path: app.py, content: "import aiohttp"}
    no_match:
      - {path: app.js, content: "from aiohttp import web"}
      - {path: app.py, content: "from flask import Flask"}

Bottle:
  key: python_bottle
  files: {extensions: [.py]}
  match:
    all:
      - contains: bottle
      - any:
          - regex: '(^|\n)\s*from\s+bottle\s+import\s+'
          - regex: '(^|\n)\s*import\s+bottle(\s|,|$)'
