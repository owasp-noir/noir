Aiohttp:
  key: python_aiohttp
  files: {extensions: [.py]}
  match:
    all:
      - contains: aiohttp
      - any:
          - regex: '(^|\n)\s*from\s+aiohttp(\.|[\s])'
          - regex: '(^|\n)\s*import\s+aiohttp(\s|,|$|\.)'
  examples:
    match:
      - {path: app.py, content: "from aiohttp import web"}
      - {path: app.py, content: "import aiohttp"}
    no_match:
      - {path: app.js, content: "from aiohttp import web"}
      - {path: app.py, content: "from flask import Flask"}

AwsLambdaPowertools:
  key: python_aws_lambda_powertools
  files: {extensions: [.py]}
  match:
    all:
      - contains: 'aws_lambda_powertools'
      - regex: '(?ms)^\s*(?:from\s+aws_lambda_powertools\.event_handler(?:\.[\w.]+)?\s+import\b|import\s+aws_lambda_powertools\.event_handler\b)'
      - regex:
          - '\b(?:APIGateway(?:Rest|Http)Resolver|ALBResolver|LambdaFunctionUrlResolver|VPCLattice(?:V2)?Resolver|BedrockAgentResolver)\b'
          - '(?ms)^\s*from\s+aws_lambda_powertools\.event_handler(?:\.api_gateway|\.router)?\s+import\s*(?:\([^)]*|[^\n]*)\bRouter\b'
  examples:
    match:
      - {path: 'app.py', content: "from aws_lambda_powertools.event_handler import APIGatewayRestResolver"}
      - {path: 'routes/todos.py', content: "from aws_lambda_powertools.event_handler.api_gateway import Router"}
      - path: 'app.py'
        content: |-
          from aws_lambda_powertools.event_handler import (
              ALBResolver,
              Response,
          )
      - path: 'app.py'
        content: |-
          from aws_lambda_powertools.event_handler import (
              Response,
              Router,
          )
    no_match:
      - {path: 'app.py', content: "from aws_lambda_powertools import Logger, Tracer"}
      - {path: 'app.py', content: "from aws_lambda_powertools.event_handler import AppSyncResolver"}
      - {path: 'app.py', content: "from aws_lambda_powertools.event_handler.appsync import Router"}
      - {path: 'app.txt', content: "from aws_lambda_powertools.event_handler import APIGatewayRestResolver"}

