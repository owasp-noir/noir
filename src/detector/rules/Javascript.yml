Adonisjs:
  key: js_adonisjs
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json, ace]}
  match:
    any:
      - all:
          - files: {basenames: [package.json]}
          - contains:
              - '@adonisjs/core'
              - '"adonis-'
      - all:
          - files: {extensions: [.ts, .js, .mjs], basenames: [ace.js, ace]}
          - contains:
              - '@adonisjs/core'
              - '@ioc:Adonis'
  examples:
    match:
      - path: 'ace'
        content: |-
          #!/usr/bin/env node
          const { Ignitor } = require('@adonisjs/core/build/standalone')
          new Ignitor(__dirname).ace().handle(process.argv.slice(2))
      - path: './ace'
        content: |-
          #!/usr/bin/env node
          const { Ignitor } = require('@adonisjs/core/build/standalone')
          new Ignitor(__dirname).ace().handle(process.argv.slice(2))
      - path: 'bin/ace'
        content: |-
          #!/usr/bin/env node
          const { Ignitor } = require('@adonisjs/core/build/standalone')
          new Ignitor(__dirname).ace().handle(process.argv.slice(2))
      - path: 'ace.js'
        content: |-
          import 'reflect-metadata'
          import { Ignitor, prettyPrintError } from '@adonisjs/core'
          const APP_ROOT = new URL('./', import.meta.url)
          new Ignitor(APP_ROOT).ace().handle(process.argv.splice(2))
      - {path: 'package.json', content: "{\"dependencies\": {\"@adonisjs/core\": \"^6.0.0\"}}"}
      - {path: 'package.json', content: "{\"dependencies\": {\"adonis-auth\": \"^3.0.0\"}}"}
      - {path: 'start/routes.ts', content: "import router from '@adonisjs/core/services/router';"}
      - {path: 'start/routes.js', content: "const Route = use('@ioc:Adonis/Core/Route');"}
      - {path: 'start/routes.mjs', content: "import router from '@adonisjs/core/services/router';"}
    no_match:
      - path: 'ace.js'
        content: |-
          define("ace/ace", ["require", "exports", "module"], function(require, exports, module) {
            "use strict";
            var ace = exports;
            ace.edit = function(el) { return new Editor(el); };
          });
      - path: 'public/js/ace.js'
        content: |-
          define("ace/ace", ["require", "exports", "module"], function(require, exports, module) {
            "use strict";
            var ace = exports;
            ace.edit = function(el) { return new Editor(el); };
          });
      - {path: 'vendor/ace/ace.js', content: "/** Ace Editor v1.4.12 */ window.ace = {};"}
      - {path: 'package.json', content: "{\"dependencies\": {\"express\": \"^4.0.0\"}}"}
      - {path: 'app.js', content: "console.log('hello');"}
    applicable:
      - 'ace'
      - './ace'
      - 'bin/ace'
      - 'ace.js'
      - 'ace.js'
      - 'package.json'
      - 'start/routes.ts'
      - 'start/routes.js'
      - 'start/routes.mjs'
    inapplicable:
      - 'app.py'

Apollo:
  key: js_apollo
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
  match:
    all:
      - contains:
          - 'apollo'
          - 'Apollo'
      - regex:
          - 'from\s+[''"]@apollo/server(?:/[^''"]*)?[''"]'
          - 'require\([''"]@apollo/server(?:/[^''"]*)?[''"]\)'
          - 'from\s+[''"]apollo-server(?:-[a-z]+)?[''"]'
          - 'require\([''"]apollo-server(?:-[a-z]+)?[''"]\)'
          - '\bnew\s+ApolloServer\s*\('
  examples:
    match:
      - {path: 'server.ts', content: "import { ApolloServer } from '@apollo/server'"}
      - {path: 'server.ts', content: "import { startStandaloneServer } from '@apollo/server/standalone'"}
      - {path: 'server.js', content: "import { ApolloServer } from 'apollo-server'"}
      - {path: 'server.js', content: "const { ApolloServer } = require('apollo-server-express')"}
      - {path: 'server.ts', content: "const server = new ApolloServer({ typeDefs, resolvers });"}
      - {path: 'server.tsx', content: "import { ApolloServer } from '@apollo/server'"}
      - {path: 'server.jsx', content: "import { ApolloServer } from '@apollo/server'"}
      - {path: 'server.mjs', content: "import { ApolloServer } from '@apollo/server'"}
      - {path: 'server.cjs', content: "import { ApolloServer } from '@apollo/server'"}
    no_match:
      - {path: 'server.ts', content: "import express from 'express'"}
      - {path: 'schema.graphql', content: "type Query { hello: String }"}

Astro:
  key: js_astro
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx, .astro], basenames: [package.json]}
  match:
    any:
      - files: {extensions: [.astro], basenames: [astro.config.mjs, astro.config.ts, astro.config.js, astro.config.cjs]}
      - all:
          - files: {basenames: [package.json]}
          - contains: '"astro"'
  examples:
    match:
      - path: 'src/pages/index.astro'
        content: |-
          ---
          const title = 'Home';
          ---
          <html><body>{title}</body></html>
      - {path: 'astro.config.mjs', content: "export default defineConfig({});"}
      - {path: 'astro.config.ts', content: "export default defineConfig({});"}
      - {path: 'astro.config.js', content: "module.exports = {};"}
      - {path: 'astro.config.cjs', content: "module.exports = {};"}
      - {path: 'package.json', content: "{\"dependencies\": {\"astro\": \"^4.0.0\"}}"}
    no_match:
      - {path: 'package.json', content: "{\"dependencies\": {\"express\": \"^4.0.0\"}}"}
      - {path: 'app.js', content: "console.log('hello')"}
    applicable:
      - 'src/pages/index.astro'
      - 'astro.config.mjs'
      - 'astro.config.ts'
      - 'astro.config.js'
      - 'astro.config.cjs'
      - 'package.json'
    inapplicable:
      - 'app.py'

Bun:
  key: js_bun
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .tsx]}
  match:
    all:
      - contains: 'Bun.serve'
      - regex: '\b(?:routes|static)\s*[:,}]|\.\s*pathname\b|\bURLPattern\b|\.\s*method\b'
  examples:
    match:
      - path: 'server.ts'
        content: |-
          Bun.serve({
            routes: { "/api/status": new Response("OK") },
          });
      - path: 'server.js'
        content: |-
          Bun.serve({
            fetch(req) {
              const url = new URL(req.url);
              if (url.pathname === "/health") return new Response("ok");
            },
          });
    no_match:
      - path: 'server.ts'
        content: |-
          import { Hono } from "hono";
          const app = new Hono();
          Bun.serve({ port: 3000, fetch: app.fetch });

Cli:
  key: js_cli
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
  match:
    regex:
      - '(?:require\s*\(\s*|from\s+)[''"](?:commander|yargs(?:/(?:yargs|helpers))?|cac|meow|minimist|mri|arg|clipanion|@oclif/(?:core|command)|sade|gluegun|command-line-args|getopts|citty)[''"]'
      - '\bparseArgs\s*\(\s*\{'
      - '\bDeno\.args\b'
      - '\bBun\.argv\b'
      - '\bprocess\.argv\.slice\s*\(\s*2\s*\)'
  examples:
    match:
      - {path: 'app.js', content: "const args = process.argv.slice(2)"}
    no_match:
      - {path: 'app.js', content: "const args = process.argv.length"}

Convex:
  key: js_convex
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json]}
  match:
    all:
      - contains: 'convex'
      - regex: '"convex"\s*:|(?:\bfrom\s*|\brequire\s*\(\s*)[''"]convex/server[''"]'
  examples:
    match:
      - {path: 'package.json', content: "{\"dependencies\": {\"convex\": \"^1.17.0\"}}"}
      - {path: 'convex/http.ts', content: "import { httpRouter } from \"convex/server\";"}
    no_match:
      - {path: 'package.json', content: "{\"dependencies\": {\"convex-helpers\": \"^0.1.0\"}}"}
      - {path: 'index.ts', content: "import { ConvexHttpClient } from \"convex/browser\";"}

Deno:
  key: js_deno
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .tsx]}
  match:
    all:
      - contains: 'Deno.serve'
      - regex: '\.\s*pathname\b|\bURLPattern\b|\.\s*method\b'
  examples:
    match:
      - path: 'main.ts'
        content: |-
          const BOOK_ROUTE = new URLPattern({ pathname: "/books/:id" });
          Deno.serve((req) => {
            const match = BOOK_ROUTE.exec(req.url);
            return new Response(match ? "book" : "missing");
          });
      - path: 'main.ts'
        content: |-
          Deno.serve({ port: 8000 }, (req) => {
            if (req.method === "POST") return new Response("created");
            return new Response("ok");
          });
    no_match:
      - path: 'main.ts'
        content: |-
          import { Hono } from "jsr:@hono/hono";
          const app = new Hono();
          Deno.serve(app.fetch);

Egg:
  key: js_egg
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json]}
  match:
    regex: '"(?:egg|egg-core|egg-bin|@eggjs/bin)"\s*:|(?:\brequire\s*\(\s*|\bfrom\s+)[''"]egg[''"]'
  examples:
    match:
      - {path: 'package.json', content: "{\"dependencies\": {\"egg\": \"^3.17.0\"}}"}
      - {path: 'package.json', content: "{\"devDependencies\": {\"@eggjs/bin\": \"^7.0.0\"}}"}
      - {path: 'package.json', content: "{\"egg\": {\"typescript\": true}}"}
      - {path: 'app/controller/home.ts', content: "import { Controller } from 'egg';"}
    no_match:
      - {path: 'package.json', content: "{\"dependencies\": {\"egg-mysql\": \"^4.0.0\"}}"}
      - {path: 'index.js', content: "const egg = require('eggplant');"}

Express:
  key: js_express
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
  match:
    all:
      - contains: express
      - regex:
          - >-
            require\(['"]express['"]\)
          - >-
            from ['"]express['"]
          - >-
            app\.use\(express\.json\(\)\)
          - >-
            app\.use\(express\.urlencoded\(\{ extended: true \}\)\)
  examples:
    match:
      - {path: index.js, content: "require('express')"}
      - {path: index.js, content: "require(\"express\")"}
      - {path: index.js, content: "import express from 'express'"}
      - {path: index.js, content: "import express from \"express\""}
      - {path: index.js, content: "const express = require('express')"}
      - {path: index.js, content: "const express = require(\"express\")"}
      - {path: index.js, content: "let express = require('express')"}
      - {path: index.js, content: "let express = require(\"express\")"}
      - {path: index.js, content: "var express = require('express')"}
      - {path: index.js, content: "var express = require(\"express\")"}
      - {path: index.js, content: "import { Router } from 'express'"}
      - {path: index.js, content: "import { Router } from \"express\""}
      - {path: index.js, content: "app.use(express.json())"}
      - {path: index.js, content: "app.use(express.urlencoded({ extended: true }))"}
    no_match:
      - {path: index.js, content: "# unrelated framework"}

Fastify:
  key: js_fastify
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx], basenames: [package.json]}
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
  match:
    all:
      - contains: fastify
      - regex:
          - >-
            require\(['"]fastify['"]\)
          - >-
            from ['"]fastify['"]
          - >-
            fastify\s*\(\s*\{
          - >-
            fastify\.register\s*\(
          - >-
            fastify\.(get|post|put|delete|patch|head|options|query|route)\s*\(
  examples:
    match:
      - {path: server.js, content: "const fastify = require('fastify')()"}
      - {path: server.ts, content: "import Fastify from 'fastify'"}
      - {path: server.js, content: "fastify.get('/path', (req, reply) => {})"}
      - {path: server.js, content: "fastify.query('/search', (req, reply) => {})"}
      - {path: server.js, content: "fastify.route({ method: 'QUERY', url: '/search' })"}
    no_match:
      - {path: server.js, content: "# unrelated framework"}

Feathers:
  key: js_feathers
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json]}
  match:
    any:
      - all:
          - files: {basenames: [package.json]}
          - regex: '"@feathersjs/[\w-]+"\s*:'
      - all:
          - files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx]}
          - contains:
              - 'feathers'
              - 'app.service'
          - regex:
              - '(?:require\(|from\s)[''"]@feathersjs/[\w./-]+[''"]'
              - '\bfeathers\s*\(\s*\)'
              - '\bapp\.service\s*\(\s*[''"][^''"]*[''"]\s*\)'
  examples:
    match:
      - {path: 'package.json', content: "{\"dependencies\": {\"@feathersjs/feathers\": \"^5.0.0\"}}"}
      - {path: 'package.json', content: "{\"dependencies\": {\"@feathersjs/express\": \"^5.0.0\"}}"}
      - {path: 'app.js', content: "const { feathers } = require('@feathersjs/feathers')"}
      - {path: 'app.js', content: "const { feathers } = require(\"@feathersjs/feathers\")"}
      - {path: 'app.ts', content: "import { feathers } from '@feathersjs/feathers'"}
      - {path: 'app.js', content: "const express = require('@feathersjs/express')"}
      - {path: 'app.js', content: "const { rest } = require('@feathersjs/express/rest')"}
      - {path: 'app.js', content: "const { koa } = require('@feathersjs/koa')"}
      - {path: 'app.js', content: "const app = feathers()"}
      - {path: 'services.js', content: "app.service('messages').hooks({})"}
    no_match:
      - {path: 'package.json', content: "{\"dependencies\": {\"express\": \"^4.18.0\"}}"}
      - {path: 'controllers/article.js', content: "const svc = strapi.service('api::article.article')"}
      - {path: 'bootstrap.js', content: "strapi.plugin('upload').service('upload')"}
      - path: 'app.js'
        content: |-
          const express = require('express')
          const app = express()
      - {path: 'index.js', content: "console.log('hello world')"}
      - {path: 'readme.md', content: "require('@feathersjs/feathers')"}

FirebaseFunctions:
  key: js_firebase_functions
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx]}
  match:
    all:
      - contains: 'firebase-functions'
      - regex: '(?:\bfrom\s*|\brequire\s*\(\s*)[''"]firebase-functions(?:/[^''"]*)?[''"]'
  examples:
    match:
      - {path: 'index.js', content: "const functions = require(\"firebase-functions\");"}
      - {path: 'index.ts', content: "import { onRequest } from \"firebase-functions/v2/https\";"}
    no_match:
      - {path: 'index.js', content: "const admin = require(\"firebase-admin\");"}
      - {path: 'package.json', content: "\"firebase-functions\": \"^6.0.0\""}

Fresh:
  key: js_fresh
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json, deno.json, deno.jsonc]}
  match:
    any:
      - files: {basenames: [fresh.config.ts, fresh.config.js]}
      - all:
          - files: {extensions: [.ts, .tsx, .js, .jsx], basenames: [main.ts, deno.json, deno.jsonc]}
          - regex: '\$fresh/|@fresh/'
  examples:
    match:
      - {path: 'deno.json', content: "{\"imports\": {\"$fresh/\": \"https://deno.land/x/fresh@1.6.8/\"}}"}
      - {path: 'deno.jsonc', content: "{\"imports\": {\"$fresh/\": \"https://deno.land/x/fresh@1.6.8/\"}}"}
      - {path: 'deno.json', content: "{\"imports\": {\"fresh\": \"jsr:@fresh/core@^2.1.1\", \"preact\": \"npm:preact@^10.27.2\"}}"}
      - {path: 'fresh.config.ts', content: "import { defineConfig } from '$fresh/server.ts';"}
      - {path: 'fresh.config.js', content: "export default {};"}
      - {path: 'main.ts', content: "import { start } from \"$fresh/server.ts\";"}
      - {path: 'routes/index.tsx', content: "import { Handlers } from \"$fresh/server.ts\";"}
      - {path: 'routes/api/users.ts', content: "import { FreshContext } from \"$fresh/server.ts\";"}
      - {path: 'routes/index.js', content: "import { Handlers } from \"$fresh/server.ts\";"}
      - {path: 'routes/index.jsx', content: "import { Handlers } from \"$fresh/server.ts\";"}
    no_match:
      - {path: 'deno.json', content: "{\"imports\": {\"@std/http\": \"jsr:@std/http@^1.0.0\"}}"}
      - {path: 'deno.json', content: "{\"tasks\": {\"start\": \"deno run main.ts\"}}"}
      - {path: 'main.ts', content: "console.log('hello');"}
      - {path: 'app.js', content: "console.log('hello')"}
    applicable:
      - 'deno.json'
      - 'deno.jsonc'
      - 'fresh.config.ts'
      - 'fresh.config.js'
      - 'main.ts'
      - 'routes/index.tsx'
      - 'routes/api/users.ts'
      - 'routes/index.js'
      - 'routes/index.jsx'
    inapplicable:
      - 'main.py'

