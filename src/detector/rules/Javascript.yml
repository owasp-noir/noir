  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
  match:
    all:
      - contains:
          - 'yoga'
          - 'Yoga'
      - regex:
          - 'from\s+[''"]graphql-yoga(?:/[^''"]*)?[''"]'
          - 'require\([''"]graphql-yoga(?:/[^''"]*)?[''"]\)'
          - 'from\s+[''"]@graphql-yoga/[^''"]+[''"]'
          - 'require\([''"]@graphql-yoga/[^''"]+[''"]\)'
          - '\bcreateYoga\s*\('
