SocketIO:
  key: js_socketio
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx], basenames: [package.json]}
  match:
    any:
      - all:
          - files: {basenames: [package.json]}
          - regex: '"socket\.io"\s*:'
      - all:
          - files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .cts, .tsx]}
          - contains:
              - 'socket.io'
              - 'new Server('
          - any:
              - regex:
                  - 'from\s+[''"]socket\.io[''"]'
                  - 'require\(\s*[''"]socket\.io[''"]\s*\)'
              - all:
                  - regex: 'new Server\('
                  - regex:
                      - '\.\s*of\s*\(\s*[''"`]/'
                      - '\.\s*broadcast\s*\.\s*emit\s*\('
                      - '\.\s*to\s*\((?:[^()]|\([^()]*\))*\)\s*\.\s*emit\s*\('
                      - '\b(?:io|socket)\s*\.\s*emit\s*\('
  examples:
    match:
      - path: 'server.js'
        content: |-
          const { Server } = require("socket.io");
          const io = new Server(3000);
          io.on("connection", (s) => s.on("msg", () => {}));
      - {path: 'server.ts', content: "import { Server } from 'socket.io';"}
      - {path: 'package.json', content: "{\"dependencies\": {\"socket.io\": \"^4.7.0\"}}"}
      - path: 'server.js'
        content: |-
          const io = new Server(httpServer);
          io.on("connection", (socket) => {
            socket.on("msg", (m) => io.emit("msg", m));
          });
      - path: 'server.js'
        content: |-
          const io = new Server(httpServer);
          io.to(roomFor(id)).emit("update", payload);
      - path: 'server.js'
        content: |-
          const io = new Server(httpServer);
          const admin = io.of("/admin");
          admin.on("connection", (socket) => socket.on("ban", () => {}));
    no_match:
      - {path: 'client.js', content: "import { io } from 'socket.io-client';"}
      - {path: 'app.js', content: "const express = require('express'); const app = express();"}
      - path: 'server.js'
        content: |-
          const { Server } = require('ws');

          const wss = new Server({ port: 8080 });
          wss.on('connection', (socket) => {
            socket.on('message', (data) => socket.send(data));
          });
      - path: 'server.ts'
        content: |-
          import { Server, ServerCredentials } from '@grpc/grpc-js';

          const server = new Server();
          process.on('SIGTERM', () => server.tryShutdown(() => {}));

