      - {path: app.ts, content: "const app = new OpenAPIHono();"}
      - {path: index.js, content: "require('hono')"}
      - {path: index.js, content: "require(\"hono\")"}
      - {path: index.js, content: "import { Hono } from 'hono'"}
      - {path: index.js, content: "import { Hono } from \"hono\""}
      - {path: index.js, content: "const { Hono } = require('hono')"}
      - {path: index.js, content: "const { Hono } = require(\"hono\")"}
      - {path: index.ts, content: "const app = new Hono()"}
      - {path: index.ts, content: "const app = new Hono({ strict: false })"}
      - {path: index.ts, content: "import { Hono } from 'hono'"}
      - {path: index.tsx, content: "import { Hono } from 'hono'"}
      - {path: index.jsx, content: "import { Hono } from 'hono'"}
      - {path: index.mjs, content: "import { Hono } from 'hono'"}
      - {path: index.cjs, content: "const { Hono } = require('hono')"}
    no_match:
      - {path: index.js, content: "require('express')"}
      - {path: index.py, content: "import { Hono } from 'hono'"}

Honox:
  key: js_honox
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .tsx], basenames: [package.json]}
  match:
    regex: '"honox"|[''"]honox/'
  examples:
    match:
      - {path: 'package.json', content: "{\"dependencies\": {\"hono\": \"^4.6.0\", \"honox\": \"^0.1.26\"}}"}
      - {path: 'app/routes/index.tsx', content: "import { createRoute } from 'honox/factory'"}
    no_match:
      - {path: 'package.json', content: "{\"dependencies\": {\"hono\": \"^4.6.0\", \"@hono/node-server\": \"^1.13.0\"}}"}
      - {path: 'src/index.ts', content: "import { Hono } from \"hono\""}
    applicable:
      - 'package.json'

Http:
  key: js_http
  gate: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .tsx], basenames: [package.json]}
  files: {extensions: [.js, .mjs, .cjs, .jsx, .ts, .mts, .tsx]}
  match:
    all:
      - contains: 'createServer'
      - regex:
          - 'require\s*\(\s*[''"](?:node:)?https?[''"]\s*\)'
          - 'from\s+[''"](?:node:)?https?[''"]'
          - 'import\s+[A-Za-z_$]\w*\s*=\s*require\s*\(\s*[''"](?:node:)?https?[''"]\s*\)'
      - regex: '\bcreateServer\b|\.\s*createServer\s*\('
      - regex:
          - '\b[A-Za-z_$]\w*\s*\.\s*method\b'
          - '(?:===|==)\s*[''"`]/|[''"`]/[^''"`]*[''"`]\s*(?:===|==)|\.\s*startsWith\s*\(\s*[''"`]/|\bcase\s+[''"`]/'
      - regex: '\b[A-Za-z_$]\w*\s*\.\s*url\b|new\s+URL\s*\('
      - regex: '[''"`]/[^''"`]*[''"`]'
  examples:
    match:
      - path: 'server.js'
        content: |-
          const http = require('http');
          http.createServer((req, res) => {
            if (req.method === 'GET' && req.url === '/api/users') res.end();
          });
      - path: 'server.js'
        content: |-
          const http = require('http');
          http.createServer((req, res) => {
            if (req.method === 'QUERY' && req.url === '/search') res.end();
          });
      - path: 'server.ts'
        content: |-
          import { createServer as createHttpsServer } from 'node:https';
          createHttpsServer((request: IncomingMessage, response: ServerResponse) => {
            const parsed = new URL(request.url ?? '/', 'https://localhost');
            if (request.method === 'POST' && parsed.pathname === '/submit') response.end();
          });
      - path: 'server.cjs'
        content: |-
          require('node:http').createServer(function (req, res) {
            if (req.method == 'DELETE' && req.url == '/items') res.end();
          });
      - path: 'server.js'
        content: |-
          const http = require('node:http');
          http.createServer((req, res) => {
            const u = new URL(req.url, 'http://localhost');
            if (u.pathname === '/status') return res.end('ok');
          });
    no_match:
      - path: 'server.ts'
        content: |-
          import { createYoga } from 'graphql-yoga';
          import { createServer } from 'node:http';

          const yoga = createYoga({ schema });
          createServer(yoga).listen(4000);
      - path: 'client.js'
        content: |-
          const http = require('http');
          http.get('http://example.com/users', res => {});
      - {path: 'package.json', content: "{\"type\":\"module\",\"engines\":{\"node\":\">=20\"}}"}

