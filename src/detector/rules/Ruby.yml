ActionCable:
  key: ruby_actioncable
  files: {extensions: [.rb, .ru]}
  match:
    regex: '<\s*ApplicationCable::Channel\b|<\s*ActionCable::Channel::Base\b|<\s*ActionCable::Connection::Base\b|\bmount\s+ActionCable\.server\b'
  examples:
    match:
      - path: app/channels/chat_channel.rb
        content: |-
          class ChatChannel < ApplicationCable::Channel
            def speak(data)
            end
          end
      - path: config/routes.rb
        content: |-
          Rails.application.routes.draw do
            mount ActionCable.server => "/cable"
          end
      - path: app/channels/application_cable/connection.rb
        content: |-
          module ApplicationCable
            class Connection < ActionCable::Connection::Base
            end
          end
    no_match:
      - path: app/controllers/foo_controller.rb
        content: |-
          class FooController < ApplicationController
          end

Cli:
  key: ruby_cli
  gate: {extensions: [.rb, .gemspec], basenames: [Gemfile]}
  match:
    any:
      - all:
          - files: {extensions: [.gemspec], basenames: [Gemfile]}
          - regex: '\b(?:gem|add(?:_runtime)?_dependency)\s*\(?\s*[''"](?:thor|gli|slop|tty-option|commander|optimist|clamp|dry-cli)[''"]'
      - all:
          - files: {extensions: [.rb]}
          - any:
              - regex:
                  - '\brequire\s+["'']optparse["'']'
                  - '\bOptionParser\.new\b'
                  - '<\s*Thor\b'
                  - '\binclude\s+GLI::App\b'
                  - '\bSlop\.(?:parse|new)\b'
                  - '\binclude\s+TTY::Option\b'
                  - '\binclude\s+Commander::Methods\b'
                  - '\bARGV\s*\[\s*\d+\s*\]'
                  - '\bOptimist(?:::|\.)options\b'
                  - '<\s*Clamp::Command\b'
                  - '<\s*Dry::CLI::Command\b'
              - contains:
                  - 'require "thor"'
                  - 'require ''thor'''
  examples:
    match:
      - {path: 'Gemfile', content: "s.add_runtime_dependency('thor')"}
    no_match:
      - {path: 'Gemfile', content: "require 'optparse_extra'"}

Grape:
  key: ruby_grape
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    any:
      - all:
          - files: {path_segments: [Gemfile]}
          - regex: '\bgem\s*\(?\s*[''"](?:grape)[''"]'
      - all:
          - files: {extensions: [.gemspec]}
          - regex: '\badd(?:_runtime)?_dependency\s*\(?\s*[''"](?:grape)[''"]'
      - all:
          - files: {extensions: [.rb]}
          - any:
              - contains: 'Grape::API'
              - regex: 'require\s+[''"]grape[''"]'
  examples:
    match:
      - {path: 'Gemfile', content: "gem 'grape'"}
      - {path: 'Gemfile', content: "gem \"grape\""}
      - path: 'app.rb'
        content: |-
          class API < Grape::API
          end
      - {path: 'app.rb', content: "require 'grape'"}
      - {path: 'Gemfile.d/my.gemspec', content: "s.add_dependency('grape')"}
    no_match:
      - {path: 'app.rb', content: "puts 'hi'"}

Graphql:
  key: ruby_graphql
  files: {extensions: [.rb]}
  match:
    regex: '<\s*(?:::)?GraphQL::Schema\b'
  examples:
    match:
      - path: app/graphql/app_schema.rb
        content: |-
          class AppSchema < GraphQL::Schema
            query Types::QueryType
          end
      - path: app/graphql/types/base_object.rb
        content: |-
          module Types
            class BaseObject < ::GraphQL::Schema::Object
            end
          end
    no_match:
      - path: lib/github.rb
        content: |-
          require "graphql/client"
          Schema = GraphQL::Client.load_schema(HTTP)
          Client = GraphQL::Client.new(schema: Schema, execute: HTTP)
      - {path: schema.py, content: "class AppSchema < GraphQL::Schema"}

Hanami:
  key: ruby_hanami
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    ruby_dependency: hanami
  examples:
    match:
      - {path: Gemfile, content: "gem 'hanami'"}
      - {path: Gemfile, content: "gem \"hanami\""}
      - path: my_app.gemspec
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'hanami', '~> 2.0'
          end
    no_match:
      - path: hanami.gemspec
        content: |-
          Gem::Specification.new do |spec|
            spec.name = "hanami"
            spec.add_dependency 'dry-system'
          end

Padrino:
  key: ruby_padrino
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    any:
      - all:
          - files: {path_segments: [Gemfile]}
          - regex: '\bgem\s*\(?\s*[''"](?:padrino|padrino-core)[''"]'
      - all:
          - files: {extensions: [.gemspec]}
          - regex: '\badd(?:_runtime)?_dependency\s*\(?\s*[''"](?:padrino|padrino-core)[''"]'
      - all:
          - files: {extensions: [.rb]}
          - any:
              - contains:
                  - 'Padrino::Application'
                  - 'Padrino.mount'
              - regex:
                  - 'require\s+[''"]padrino-core[''"]'
                  - 'require\s+[''"]padrino[''"]'
  examples:
    match:
      - {path: 'Gemfile', content: "gem 'padrino'"}
      - {path: 'Gemfile', content: "gem \"padrino\""}
      - {path: 'Gemfile', content: "gem 'padrino-core'"}
      - {path: 'Gemfile', content: "gem('padrino', '~> 0.15')"}
      - path: 'foo.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'padrino-core', '~> 0.15'
          end
      - path: 'foo.gemspec'
        content: |-
          Gem::Specification.new do |spec|
            spec.add_runtime_dependency "padrino", ">= 0.15"
          end
      - path: 'app/app.rb'
        content: |-
          class Blog < Padrino::Application
            get '/' do
              'hi'
            end
          end
      - {path: 'config/apps.rb', content: "Padrino.mount('blog').to('/blog')"}
      - {path: 'app.rb', content: "require 'padrino-core'"}
      - {path: 'app.rb', content: "require 'padrino'"}
      - {path: 'Gemfile.d/my.gemspec', content: "s.add_dependency('padrino-core')"}
    no_match:
      - {path: 'Gemfile', content: "gem 'sinatra'"}
      - path: 'foo.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'rails'
          end
      - path: 'app.rb'
        content: |-
          class Blog < Sinatra::Base
            get '/' do
              'hi'
            end
          end

Rails:
  key: ruby_rails
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    any:
      - ruby_dependency: 'rails'
      - ruby_dependency: 'railties'
      - all:
          - files: {extensions: [.rb, .ru]}
          - not:
              files: {path_segments: [Gemfile]}
          - regex:
              - '(^|\W)[A-Za-z_:][\w:]*\.routes\.draw\b'
              - '(^|\W)Rails\.application\b'
              - '(^|\W)Rails::Application\b'
              - '(^|\s)require\s+["'']rails/all["'']'
  examples:
    match:
      - {path: 'Gemfile', content: "gem 'rails'"}
      - {path: 'Gemfile', content: "gem \"rails\""}
      - {path: 'Gemfile', content: "gem 'railties', '~> 8.0.0'"}
      - {path: 'Gemfile', content: "gem \"railties\", \"~> 8.0.0\""}
      - path: 'spree/core/spree_core.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.name = "spree_core"
            s.add_dependency 'rails', '>= 7.2', '< 8.2'
          end
      - path: 'foo.gemspec'
        content: |-
          Gem::Specification.new do |spec|
            spec.add_dependency "railties", "~> 8.0.0"
          end
      - path: 'legacy.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.add_runtime_dependency 'rails', '~> 7.0'
          end
      - path: 'engine.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency('railties', "~> 8.0")
          end
      - path: 'config/routes.rb'
        content: |-
          Rails.application.routes.draw do
            get '/api/posts', to: 'posts#index'
            resources :comments, only: [:index, :show]
          end
      - path: 'config/routes.rb'
        content: |-
          Blog::Application.routes.draw do
            root to: 'posts#index'
          end
      - path: 'config.ru'
        content: |-
          require_relative "config/environment"
          run Rails.application
          Rails.application.load_server
      - path: 'config/application.rb'
        content: |-
          require_relative "boot"
          require "rails/all"

          module Blog
            class Application < Rails::Application
              config.load_defaults 8.0
            end
          end
    no_match:
      - path: 'Gemfile'
        content: |-
          gem 'sinatra'
          gem 'rack'
      - path: 'sinatra-thing.gemspec'
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'sinatra'
            s.add_dependency 'rack'
          end
      - path: 'Gemfile'
        content: |-
          gem 'jquery-rails'
          gem 'sinatra'
      - path: 'app/controllers/posts_controller.rb'
        content: |-
          class PostsController < ApplicationController
            def index
              @posts = Post.all
            end
          end
      - path: 'config/routes.rb'
        content: |-
          Hanami.application.routes do
            get "/posts", to: "posts.index"
          end
      - path: 'lib/thing.rb'
        content: |-
          # This gem works with Rails, Sinatra and Hanami applications.
          # See the rails/all guide for details.
          module Thing
          end
      - {path: 'Gemfile.d/routes.rb', content: "Rails.application.routes.draw do"}

Roda:
  key: ruby_roda
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    any:
      - all:
          - files: {path_segments: [Gemfile]}
          - regex: '\bgem\s*\(?\s*[''"](?:roda)[''"]'
      - all:
          - files: {extensions: [.gemspec]}
          - regex: '\badd(?:_runtime)?_dependency\s*\(?\s*[''"](?:roda)[''"]'
      - all:
          - files: {extensions: [.rb]}
          - any:
              - regex:
                  - '<\s*Roda\b'
                  - 'require\s+[''"]roda[''"]'
              - contains: 'Roda.route'
  examples:
    match:
      - {path: 'Gemfile', content: "gem 'roda'"}
      - {path: 'Gemfile', content: "gem \"roda\""}
      - path: 'app.rb'
        content: |-
          class App < Roda
          end
      - {path: 'app.rb', content: "require \"roda\""}
      - {path: 'app.rb', content: "Roda.route { |r| }"}
      - {path: 'Gemfile.d/my.gemspec', content: "s.add_dependency('roda')"}
    no_match:
      - {path: 'Gemfile', content: "gem 'sinatra'"}

Sinatra:
  key: ruby_sinatra
  gate: {extensions: [.rb, .ru, .gemspec], basenames: [Gemfile, Gemfile.lock]}
  match:
    ruby_dependency: sinatra
  examples:
    match:
      - {path: Gemfile, content: "gem 'sinatra'"}
      - {path: Gemfile, content: "gem \"sinatra\""}
      - path: gollum.gemspec
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'sinatra', '~> 4.0'
          end
      - path: foo.gemspec
        content: |-
          Gem::Specification.new do |spec|
            spec.add_runtime_dependency "sinatra", ">= 2.0"
          end
      - path: geminabox.gemspec
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency('sinatra', "~> 4.0")
          end
      - {path: Gemfile, content: "gem('sinatra', '~> 4.0')"}
    no_match:
      - path: foo.gemspec
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'rails'
          end
      - path: foo.gemspec
        content: |-
          Gem::Specification.new do |s|
            s.add_dependency 'sinatra-contrib'
          end

Webrick:
  key: ruby_webrick
  files: {extensions: [.rb, .ru]}
  match:
    contains: [WEBrick, webrick, mount_proc, AbstractServlet]
  examples:
    match:
      - path: server.rb
        content: |-
          require 'webrick'
          server = WEBrick::HTTPServer.new
      - {path: app.rb, content: "require \"webrick\""}
      - path: srv.rb
        content: |-
          server = WEBrick::HTTPServer.new(Port: 8080)
          server.mount_proc '/' do |req, res|
          end
      - {path: p.rb, content: "server.mount_proc('/api') do |req, res| end"}
      - path: handler.rb
        content: |-
          class MyHandler < WEBrick::HTTPServlet::AbstractServlet
            def do_GET(req, res); end
          end
      - path: h.rb
        content: |-
          require 'webrick'
          class MyHandler < HTTPServlet::AbstractServlet
            def do_POST(req, res); end
          end
      - path: doc.rb
        content: |-
          # use webrick for the server
          # WEBrick::HTTPServer
    no_match:
      - {path: Gemfile, content: "gem 'webrick'"}
      - path: plain.rb
        content: |-
          puts 'hello'
          class Foo; end
