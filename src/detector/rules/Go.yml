Http:
  key: go_http
  gate: {extensions: [.go], path_segments: [go.mod]}
  files: {extensions: [.go]}
  match:
    all:
      - contains: net/http
      - any:
          - contains: NewServeMux
          - regex: 'http\.HandleFunc\s*\('
          - regex: 'http\.Handle\s*\(\s*["`/]'
  examples:
    match:
      - path: main.go
        content: |-
          package main
          import "net/http"
          func main() {
              http.HandleFunc("/hello", handler)
          }
      - path: main.go
        content: |-
          package main
          import h "net/http"
          func main() {
              m := h.NewServeMux()
              m.HandleFunc("/api", h2)
          }
    no_match:
      - path: main.go
        content: |-
          package main
          import "net/http"
          func handler(w http.ResponseWriter, r *http.Request) {}
      - {path: go.mod, content: "module example.com/app"}

