Beego:
  key: go_beego
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    go_dependency: 'github\.com/beego/beego'
  examples:
    match:
      - {path: go.mod, content: "github.com/beego/beego"}
    no_match:
      - {path: go.mod, content: "github.com/beego/beego // indirect"}

Chi:
  key: go_chi
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    go_dependency: 'github\.com/go-chi/chi'
  examples:
    match:
      - {path: go.mod, content: "github.com/go-chi/chi"}
    no_match:
      - {path: go.mod, content: "github.com/go-chi/chi // indirect"}

Cli:
  key: go_cli
  gate: {extensions: [.go], basenames: [go.mod]}
  match:
    any:
      - all:
          - files: {basenames: [go.mod]}
          - go_dependency: &cli_modules 'github\.com/(?:spf13/(?:cobra|pflag)|urfave/cli|alexflint/go-arg|jessevdk/go-flags|alecthomas/(?:kong|kingpin)|mitchellh/cli)|gopkg\.in/alecthomas/kingpin\.v2'
      - all:
          - files: {extensions: [.go]}
          - any:
              - regex: *cli_modules
              - all:
                  - not:
                      regex: '\b(?:http|fasthttp)\.ListenAndServe(?:TLS)?\s*\(|\.(?:ListenAndServe|RunTLS)\s*\('
                  - any:
                      - all:
                          - regex: '"flag"'
                          - regex: '\bflag\.(?:Parse|Args?|NArg|String(?:Var)?|Int(?:64)?(?:Var)?|Uint(?:64)?(?:Var)?|Bool(?:Var)?|Float64(?:Var)?|Duration(?:Var)?|Var)\s*\('
                      - regex: '\bos\.Args\s*\['
  examples:
    match:
      - {path: 'app.go', content: "if len(os.Args[1:]) > 0 {}"}
      - {path: go.mod, content: "require github.com/spf13/cobra v1.8.0"}
    no_match:
      - {path: 'app.go', content: "func main() { http.ListenAndServe(os.Args[1], nil) }"}
      - {path: go.mod, content: "require github.com/spf13/cobra v1.8.0 // indirect"}

ConnectRpc:
  key: go_connect_rpc
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    go_dependency: 'connectrpc\.com/connect'
  examples:
    match:
      - {path: go.mod, content: "require connectrpc.com/connect v1.16.0"}
      - {path: main.go, content: "import \"connectrpc.com/connect\""}
    no_match:
      - {path: go.mod, content: "require github.com/gin-gonic/gin v1.9.0"}
      - {path: main.go, content: "import \"github.com/gin-gonic/gin\""}
      - {path: README.md, content: "connectrpc.com/connect"}

Echo:
  key: go_echo
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    go_dependency: 'github\.com/labstack/echo'
  examples:
    match:
      - {path: go.mod, content: "github.com/labstack/echo"}
      - path: go.mod
        content: |
          require github.com/labstack/echo/v4 v4.13.3 // pinned, not indirect
      - path: go.mod
        content: |
          require github.com/labstack/echo/v4 v4.13.3 // indirectly via plugin
      - path: go.mod
        content: |
          require github.com/labstack/echo/v4 v4.13.3 // indirect foo
      - path: main.go
        content: |
          package main

          import "github.com/labstack/echo/v4"
      - path: main.go
        content: |
          /* License */
          package main

          import (
          	"net/http"

          	mw "github.com/labstack/echo/v4"
          )
      - path: main.go
        content: |
          package main

          import (
          	"net/http" // stdlib (HTTP)
          	"github.com/labstack/echo/v4"
          )
      - path: main.go
        content: |
          package main

          import (
          	// helpers (internal)
          	web "github.com/labstack/echo/v4"
          )
      - path: go.mod
        content: |-
          module example.com/myapp

          go 1.21

          require (
            github.com/labstack/echo/v4 v4.13.3
            github.com/other/lib v1.0.0 // indirect
          )
    no_match:
      - path: go.mod
        content: |-
          module example.com/myapp

          go 1.21

          require github.com/labstack/echo/v4 v4.13.3 // indirect
      - path: go.mod
        content: |
          require github.com/labstack/echo/v4 v4.13.3 //indirect
      - path: go.mod
        content: |
          require github.com/labstack/echo/v4 v4.13.3 // indirect; used by tools
      - path: doc.go
        content: |
          // Works with routers such as github.com/labstack/echo.
          package adapter
      - path: gen.go
        content: |
          package gen

          import "fmt"

          const t = `package main

          import "github.com/labstack/echo/v4"
          `
      - path: gen.go
        content: |
          package gen

          import (
          	// "github.com/labstack/echo/v4"
          	"fmt"
          )
      - path: gen.go
        content: |
          //go:build ignore

          package main

          import "github.com/labstack/echo/v4"
      - path: lib_test.go
        content: |
          package main

          import "github.com/labstack/echo/v4"
      - path: testdata/src/app/main.go
        content: |
          package main

          import "github.com/labstack/echo/v4"
      - path: vendor/example.com/x/main.go
        content: |
          package main

          import "github.com/labstack/echo/v4"

Encore:
  key: go_encore
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    any:
      - all:
          - files: {extensions: [.go]}
          - regex: &encore_signal '\bencore\.dev\s+v\d|"encore\.dev/|(?m:^//encore:api\b)'
      - all:
          - files: {path_segments: [go.mod]}
          - go_dependency: *encore_signal
  examples:
    match:
      - {path: go.mod, content: "module encore.app\n\nrequire encore.dev v1.41.0"}
      - {path: hello/hello.go, content: "import \"encore.dev/rlog\""}
      - {path: hello/hello.go, content: "package hello\n\n//encore:api public\nfunc Ping() {}"}
    no_match:
      - {path: main.go, content: "// see https://encore.dev for docs\npackage main"}
      - {path: go.mod, content: "require encore.dev v1.41.0 // indirect"}

Fasthttp:
  key: go_fasthttp
  gate: {extensions: [.go], path_segments: [go.mod]}
  match:
    all:
      - go_mod_dependency: 'github.com/valyala/fasthttp'
      - not:
          contains: 'github.com/gofiber/fiber'
  examples:
    match:
      - {path: 'go.mod', content: "github.com/valyala/fasthttp"}
    no_match:
      - path: 'go.mod'
        content: |-
          github.com/valyala/fasthttp
          github.com/gofiber/fiber
      - {path: 'go.mod', content: "github.com/gin-gonic/gin"}
      - {path: 'main.go', content: "github.com/valyala/fasthttp"}

