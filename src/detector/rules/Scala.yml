Akka:
  key: scala_akka
  gate: {extensions: [.scala, .sbt], basenames: [build.sbt]}
  files: {extensions: [.scala]}
  match:
    regex: '\bimport\s+(?:akka|org\.apache\.pekko)\.http\b'
  examples:
    match:
      - {path: test.scala, content: "import akka.http.scaladsl.server.Directives._"}
      - {path: test.scala, content: "import akka.http.scaladsl.Http"}
      - {path: test.scala, content: "import org.apache.pekko.http.scaladsl.server.Directives._"}
    no_match:
      - {path: test.scala, content: "import org.apache.pekko.actor.typed.ActorSystem"}
      - {path: test.scala, content: "ConfigFactory.parseString(\"pekko.http.server.idle-timeout = 5s\")"}
      - {path: test.scala, content: "import scala.concurrent.Future"}
      - {path: test.java, content: "import akka.http.scaladsl.server.Directives._"}

Cli:
  key: scala_cli
  files: {extensions: [.scala, .sc]}
  match:
    regex: '\bscopt\b|\bOParser\b|\bcom\.monovore\.decline\b|\bimport\s+com\.monovore\.decline|\bOpts\.(?:option|flag|argument|arguments)\b|\bmainargs\b|@main\b|\borg\.rogach\.scallop\b|\bScallopConf\b|\bcom\.twitter\.app\b'
  examples:
    match:
      - {path: 'app.scala', content: "import scopt.OParser"}
    no_match:
      - {path: 'app.scala', content: "object Main extends App"}

Finatra:
  key: scala_finatra
  gate: {extensions: [.scala], basenames: [build.sbt]}
  match:
    any:
      - all:
          - files: {extensions: [build.sbt]}
          - contains: finatra-http
      - all:
          - files: {extensions: [.scala]}
          - regex: '\bimport\s+com\.twitter\.finatra\.http\b'
  examples:
    match:
      - {path: UserController.scala, content: "import com.twitter.finatra.http.Controller"}
      - {path: build.sbt, content: "libraryDependencies += \"com.twitter\" %% \"finatra-http-server\" % \"22.12.0\""}
    no_match:
      - {path: Main.scala, content: "import com.twitter.finagle.http.Request"}
      - path: Servlet.scala
        content: |-
          import org.scalatra._
          get("/x") { }
      - {path: Main.java, content: "import com.twitter.finatra.http.Controller"}

Http4s:
  key: scala_http4s
  files: {extensions: [.scala, .sbt], basenames: [build.sbt]}
  match:
    contains: [org.http4s, http4s-dsl]
  examples:
    match:
      - {path: Server.scala, content: "import org.http4s.HttpRoutes"}
    no_match:
      - {path: Server.scala, content: "# unrelated framework"}

Play:
  key: scala_play
  gate: {extensions: [.scala, .sbt, routes, routes.conf], basenames: [build.sbt]}
  match:
    any:
      - all:
          - files: {extensions: [.scala]}
          - contains:
              - 'play.api.mvc'
              - 'play.api.routing'
              - 'play.api.libs.json'
              - 'BaseController'
              - 'AbstractController'
      - all:
          - files: {extensions: [routes, routes.conf]}
          - regex: '(?ms)^\s*(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s+'
          - contains: 'Option['
  examples:
    match:
      - {path: 'routes', content: "GET /users controllers.Users.list(page: Option[Int])"}
      - {path: 'routes.conf', content: "POST /users/:id controllers.Users.update(id: Long, name: Option[String] ?= None)"}
      - {path: 'test.scala', content: "import play.api.mvc._"}
      - {path: 'test.scala', content: "class Users extends BaseController"}
      - {path: 'test.scala', content: "class Users extends AbstractController"}
      - {path: 'test.scala', content: "import play.api.routing.Router"}
    no_match:
      - {path: 'test.scala', content: "import scala.concurrent.Future"}
      - {path: 'test.java', content: "import play.api.mvc._"}
      - {path: 'routes', content: "# Just comments"}
      - {path: 'conf/routes', content: "GET /clients controllers.Clients.list(page: Int ?= 1, label: String ?= \"new,hot\")"}
    applicable:
      - 'conf/routes'
      - 'conf/admin.routes'
      - 'conf/routes.conf'
      - 'routes'
      - 'build.sbt'
      - 'app/controllers/HomeController.scala'
    inapplicable:
      - 'app/controllers/HomeController.java'

Scalatra:
  key: scala_scalatra
  gate: {extensions: [.scala, .sbt], basenames: [build.sbt]}
  files: {extensions: [.scala]}
  match:
    contains: [org.scalatra, ScalatraServlet]
  examples:
    match:
      - {path: test.scala, content: "import org.scalatra._"}
      - {path: test.scala, content: "class MyServlet extends ScalatraServlet"}
    no_match:
      - {path: test.scala, content: "import scala.concurrent.Future"}
      - {path: test.java, content: "import org.scalatra._"}

Tapir:
  key: scala_tapir
  gate: {extensions: [.scala, .sbt], basenames: [build.sbt]}
  files: {extensions: [.scala]}
  match:
    contains: [sttp.tapir, 'import tapir.']
  examples:
    match:
      - {path: test.scala, content: "import sttp.tapir._"}
      - {path: test.scala, content: "import sttp.tapir.json.circe._"}
    no_match:
      - {path: test.scala, content: "import scala.concurrent.Future"}
      - {path: test.java, content: "import sttp.tapir._"}

ZioHttp:
  key: scala_zio_http
  gate: {extensions: [.scala, .sbt], basenames: [build.sbt]}
  files: {extensions: [.scala]}
  match:
    contains: [zio.http, zhttp.http]
  examples:
    match:
      - {path: test.scala, content: "import zio.http._"}
      - {path: test.scala, content: "val routes = Routes(Method.GET / \"x\" -> handler(zio.http.Response.ok))"}
    no_match:
      - {path: test.scala, content: "import scala.concurrent.Future"}
      - {path: test.java, content: "import zio.http._"}
