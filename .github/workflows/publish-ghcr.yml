---
name: GHCR Publish
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
on:
  # `:main` is rebuilt once a night, not on every push. A push-triggered build
  # ran two release compiles (about 13 and 17 minutes) for each merge that
  # touched `src/**`: 437 runs in 30 days. Nothing that reads `:main` needs it
  # within minutes of a merge: people pulling the edge image get an analyzer
  # change the next morning, and a manual run (no `version`) refreshes it on
  # demand. The `changed` job below skips the night when the published image
  # was already built from a tree with the same image inputs.
  schedule:
    - cron: "17 18 * * *"
  # The exception: the action's inputs (action.yml) and the entrypoint inside
  # the image change together. `uses: owasp-noir/noir@main` reads action.yml
  # from the branch and pulls `:main`, so a night between the two would run a
  # new action.yml against an old entrypoint. These paths change rarely.
  push:
    branches: [main]
    paths:
      - action.yml
      - github-action/entrypoint.sh
      - packaging/docker/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and tag (e.g., 0.0.13). Leave empty to rebuild :main.
        required: false
        default: ""
        type: string

# One run at a time for everything that can move `:main`, in the order the
# runs were requested. Without this a nightly build that started first and
# finished last would put `:main` back on the older commit, undoing an
# entrypoint push. A release publishes version tags and `latest` only, so it
# has a group of its own.
concurrency:
  group: ghcr-${{ github.event_name == 'release' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changed:
    # Only the nightly run asks this question. A release or a manual run is an
    # explicit request and always builds.
    #
    # The published image records the commit it was built from
    # (`org.opencontainers.image.revision`, set by docker/metadata-action). If
    # nothing that lands in the image differs between that commit and HEAD, a
    # rebuild would push the same program under a new digest. This compares
    # this repository's sources only: the path list is what the old push
    # trigger watched (Dockerfile.dockerignore drops spec/, docs/, .github/
    # and *.md from the build context), and the passive rules the Dockerfile
    # clones from their own repository are not part of it. Any doubt (no image
    # yet, a label that is missing, a revision this clone cannot find)
    # resolves to "build".
    name: Image inputs changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare HEAD with the published :main image
        id: diff
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          MANUAL_MAIN_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.version == '' }}
        run: |
          # A manual run without a version means "rebuild :main". From any
          # other ref it would publish that branch's name as a tag, or no tag
          # at all.
          if [ "$MANUAL_MAIN_REFRESH" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main, or give a version."
            exit 1
          fi
          if [ "$SCHEDULED" != "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revision=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          echo "published revision: ${revision:-unknown}"
          build=true
          if printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "$revision^{commit}" 2>/dev/null; then
            if git diff --quiet "$revision" HEAD -- \
              .github/workflows/publish-ghcr.yml packaging/docker shard.yml shard.lock src github-action/entrypoint.sh; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Prepare platform slug
        id: platform
        run: |
          echo "slug=$(echo '${{ matrix.arch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Build and push by digest (no tag yet)
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ steps.platform.outputs.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v2.1.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalize version: strip leading 'v' if present
      - name: Normalize version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        id: normalize
        run: |
          RAW_VERSION="${{ inputs.version }}"
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # nightly run, or a manual run from main -> :main
            type=ref,event=branch

            # GitHub Release v1.2.3 -> 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            # Manual dispatch with a version -> that version + latest
            type=raw,value=${{ steps.normalize.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
