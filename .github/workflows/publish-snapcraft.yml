---
name: Snapcraft Publish
on:
  # The nightly run only builds: it proves snap/snapcraft.yaml still builds
  # the current source. That check used to be a ci.yml job on every push to
  # main that touched `src/**`, about ten minutes each time. The publish step
  # below runs for a release or a manual run only.
  schedule:
    - cron: "47 18 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: warning
      tags:
        description: Test scenario tags
permissions:
  contents: read

jobs:
  snapcraft-releaser:
    runs-on: ubuntu-latest
    name: snapcraft-releaser
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
        #- arm64
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - uses: canonical/action-build@v1
        id: build
      - if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
